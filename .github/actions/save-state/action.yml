name: Save Live Show Radar state
description: Saves the job's state file and the shared snapshot to the Actions cache.
inputs:
  job:
    description: Job name
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache/save@v4
      if: hashFiles(format('.radar-state/job-{0}.json', inputs.job)) != ''
      with:
        path: .radar-state/job-${{ inputs.job }}.json
        key: radar-job-${{ inputs.job }}-${{ github.run_id }}-${{ github.run_attempt }}
    - uses: actions/cache/save@v4
      if: hashFiles('.radar-state/snapshot.json') != ''
      with:
        path: .radar-state/snapshot.json
        key: radar-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
