name: keepalive
# GitHub disables scheduled workflows in public repos after 60 days without repository activity.
# Once a month this commits a one-line timestamp (repository activity) and re-enables the
# scheduled workflows in case any were already disabled. See README → "Keepalive".
on:
  schedule:
    - cron: "15 4 1 * *"
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Record activity
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive [skip ci]" || echo "nothing to commit"
          git push
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in poll.yml tiers.yml watchlist.yml sunday.yml; do
            gh workflow enable "$wf" --repo "$GITHUB_REPOSITORY" || true
          done
